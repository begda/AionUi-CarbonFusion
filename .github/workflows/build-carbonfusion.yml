name: ' CarbonFusion Build & Release'

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [carbonfusion-dev]
  pull_request:
    branches: [carbonfusion-dev]

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  build-pipeline:
    name: Build Pipeline
    uses: ./.github/workflows/_build-reusable.yml
    secrets: inherit
    with:
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"},
          {"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"}
        ]}
      skip_code_quality: true
      append_commit_hash: true
      upload_installers_only: true

  create-tag:
    name: Create Tag from Branch
    runs-on: ubuntu-latest
    needs: build-pipeline
    if: success() && github.ref == 'refs/heads/carbonfusion-dev'
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create and push tag
        id: create_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          TAG_NAME="v${VERSION}-carbonfusion-${COMMIT_SHORT}"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            echo "⚠️ Tag $TAG_NAME already exists, proceeding with existing tag"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin $TAG_NAME
          echo "✅ Successfully created and pushed tag: $TAG_NAME"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-pipeline, create-tag]
    if: success() && github.ref == 'refs/heads/carbonfusion-dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get release tag
        id: tag
        run: |
          echo "tag_name=${{ needs.create-tag.outputs.tag_name }}" >> $GITHUB_OUTPUT
          echo "Release tag: ${{ needs.create-tag.outputs.tag_name }}"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare release assets
        shell: bash
        run: bash scripts/prepare-release-assets-carbonfusion.sh build-artifacts release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: CarbonFusion ${{ steps.tag.outputs.tag_name }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.deb
            release-assets/**/*.zip
          generate_release_notes: true
          draft: true
          prerelease: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
